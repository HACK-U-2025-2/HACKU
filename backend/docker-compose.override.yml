services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.gpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_MOCK_MODEL: "False"
    volumes:
      - .:/app

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]