openapi: 3.1.0
info:
  title: mindly
  description: "\u30A2\u30A4\u30C7\u30A2\u3092\u5373\u6642\u306B\u8A18\u9332\u30FB\
    \u7BA1\u7406\u3059\u308B\u305F\u3081\u306EAPI"
  version: 1.0.0
paths:
  /auth:
    post:
      tags:
      - Auth
      summary: Handle Login
      operationId: handle_login_auth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tags:
    get:
      tags:
      - Tags
      summary: Handle Get Tags
      operationId: handle_get_tags_tags_get
      security:
      - HTTPBearer: []
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u691C\u7D22\u30AD\u30FC\u30EF\u30FC\u30C9"
          title: Keyword
        description: "\u691C\u7D22\u30AD\u30FC\u30EF\u30FC\u30C9"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagCountResponse'
                title: Response Handle Get Tags Tags Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/:
    get:
      tags:
      - Memos
      summary: Handle Read Memos
      operationId: handle_read_memos_memos__get
      security:
      - HTTPBearer: []
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "\u691C\u7D22\u30AD\u30FC\u30EF\u30FC\u30C9"
          title: Keyword
        description: "\u691C\u7D22\u30AD\u30FC\u30EF\u30FC\u30C9"
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: "\u30BF\u30B0\u3067\u306E\u7D5E\u308A\u8FBC\u307F"
          title: Tags
        description: "\u30BF\u30B0\u3067\u306E\u7D5E\u308A\u8FBC\u307F"
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MemoSortOrder'
          - type: 'null'
          description: "\u30BD\u30FC\u30C8\u9806"
          title: Sort
        description: "\u30BD\u30FC\u30C8\u9806"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoPreviewResponse'
                title: Response Handle Read Memos Memos  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Memos
      summary: Handle Create Memo
      operationId: handle_create_memo_memos__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/random:
    get:
      tags:
      - Memos
      summary: Handle Read Memos
      operationId: handle_read_memos_memos_random_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemoPreviewResponse'
                type: array
                title: Response Handle Read Memos Memos Random Get
      security:
      - HTTPBearer: []
  /memos/embeddings:
    get:
      tags:
      - Memos
      summary: Hangle Read Memo Embeddings
      operationId: hangle_read_memo_embeddings_memos_embeddings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemoEmbeddingResponse'
                type: array
                title: Response Hangle Read Memo Embeddings Memos Embeddings Get
      security:
      - HTTPBearer: []
  /memos/{memo_id}:
    get:
      tags:
      - Memos
      summary: Hangle Read Memo By Id
      operationId: hangle_read_memo_by_id_memos__memo_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Memos
      summary: Handle Update Tags
      operationId: handle_update_tags_memos__memo_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoAllUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Memos
      summary: Handle Delete Memo
      operationId: handle_delete_memo_memos__memo_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/{memo_id}/relate:
    get:
      tags:
      - Memos
      summary: Handle Read Memo Relates
      operationId: handle_read_memo_relates_memos__memo_id__relate_get
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoPreviewResponse'
                title: Response Handle Read Memo Relates Memos  Memo Id  Relate Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/{memo_id}/title:
    patch:
      tags:
      - Memos
      summary: Handle Update Title
      operationId: handle_update_title_memos__memo_id__title_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoTitleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/{memo_id}/body:
    patch:
      tags:
      - Memos
      summary: Handle Update Body
      operationId: handle_update_body_memos__memo_id__body_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoBodyUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/{memo_id}/tags:
    patch:
      tags:
      - Memos
      summary: Handle Update Tags
      operationId: handle_update_tags_memos__memo_id__tags_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoTagsUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /memos/{memo_id}/favorite:
    patch:
      tags:
      - Memos
      summary: Handle Update Tags
      operationId: handle_update_tags_memos__memo_id__favorite_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: memo_id
        in: path
        required: true
        schema:
          type: integer
          title: Memo Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoFavoriteUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /demos/get_user_name:
    get:
      tags:
      - Demos
      summary: Demo Get User Name
      operationId: demo_get_user_name_demos_get_user_name_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Demo Get User Name Demos Get User Name Get
  /demos/get_memos:
    get:
      tags:
      - Demos
      summary: Demo Get User Name
      operationId: demo_get_user_name_demos_get_memos_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemoRead'
                type: array
                title: Response Demo Get User Name Demos Get Memos Get
  /demos/get_tags:
    get:
      tags:
      - Demos
      summary: Demo Get User Name
      operationId: demo_get_user_name_demos_get_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagRead'
                type: array
                title: Response Demo Get User Name Demos Get Tags Get
  /demos/auto_delete:
    get:
      tags:
      - Demos
      summary: Demo Get Delete Memos Target
      operationId: demo_get_delete_memos_target_demos_auto_delete_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Demo Get Delete Memos Target Demos Auto Delete Get
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        user_id:
          type: string
          minLength: 1
          title: User Id
          examples:
          - a
      type: object
      required:
      - user_id
      title: LoginRequest
    MemoAllUpdateRequest:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
          examples:
          - title
        body:
          type: string
          minLength: 1
          title: Body
          examples:
          - summary
        tag_names:
          items:
            type: string
            minLength: 1
          type: array
          title: Tag Names
          examples:
          - - "\u30BF\u30B01"
            - "\u30BF\u30B02"
      type: object
      required:
      - title
      - body
      title: MemoAllUpdateRequest
    MemoBodyUpdateRequest:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
          examples:
          - summary
      type: object
      required:
      - body
      title: MemoBodyUpdateRequest
    MemoCreateRequest:
      properties:
        raw:
          type: string
          minLength: 1
          title: Raw
          examples:
          - raw text
        tag_names:
          items:
            type: string
            minLength: 1
          type: array
          title: Tag Names
          examples:
          - - "\u30BF\u30B01"
            - "\u30BF\u30B02"
        need_generate_tags:
          type: boolean
          title: Need Generate Tags
          examples:
          - true
        need_proofreading:
          type: boolean
          title: Need Proofreading
          examples:
          - true
      type: object
      required:
      - raw
      - need_generate_tags
      - need_proofreading
      title: MemoCreateRequest
    MemoEmbeddingResponse:
      properties:
        id:
          type: integer
          exclusiveMinimum: 0.0
          title: Id
          examples:
          - 1
        title:
          type: string
          minLength: 1
          title: Title
          examples:
          - Title
        user_id:
          type: string
          minLength: 1
          title: User Id
          examples:
          - User
        simple_embedding:
          items:
            type: number
          type: array
          maxItems: 3
          minItems: 3
          title: Simple Embedding
          examples:
          - - 0.1
            - 0.2
            - 0.3
      type: object
      required:
      - id
      - title
      - user_id
      - simple_embedding
      title: MemoEmbeddingResponse
    MemoFavoriteUpdateRequest:
      properties:
        is_favorite:
          type: boolean
          title: Is Favorite
          examples:
          - false
      type: object
      required:
      - is_favorite
      title: MemoFavoriteUpdateRequest
    MemoPreviewResponse:
      properties:
        id:
          type: integer
          exclusiveMinimum: 0.0
          title: Id
          examples:
          - 1
        title:
          type: string
          minLength: 1
          title: Title
          examples:
          - Title
        user_id:
          type: string
          minLength: 1
          title: User Id
          examples:
          - User
        body:
          type: string
          minLength: 1
          title: Body
          examples:
          - Body
        is_favorite:
          type: boolean
          title: Is Favorite
          examples:
          - false
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - title
      - user_id
      - body
      - is_favorite
      - created_at
      - updated_at
      title: MemoPreviewResponse
    MemoRead:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        user_id:
          type: string
          title: User Id
        body:
          type: string
          title: Body
        raw:
          type: string
          title: Raw
        simple_embedding:
          items:
            type: number
          type: array
          title: Simple Embedding
        is_favorite:
          type: boolean
          title: Is Favorite
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - title
      - user_id
      - body
      - raw
      - simple_embedding
      - is_favorite
      - created_at
      - updated_at
      title: MemoRead
    MemoResponse:
      properties:
        id:
          type: integer
          exclusiveMinimum: 0.0
          title: Id
          examples:
          - 1
        title:
          type: string
          minLength: 1
          title: Title
          examples:
          - Title
        user_id:
          type: string
          minLength: 1
          title: User Id
          examples:
          - User
        body:
          type: string
          minLength: 1
          title: Body
          examples:
          - Body
        raw:
          type: string
          minLength: 1
          title: Raw
          examples:
          - Body
        tags:
          items:
            $ref: '#/components/schemas/TagResponse'
          type: array
          title: Tags
        is_favorite:
          type: boolean
          title: Is Favorite
          examples:
          - false
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - title
      - user_id
      - body
      - raw
      - is_favorite
      - created_at
      - updated_at
      title: MemoResponse
    MemoSortOrder:
      type: string
      enum:
      - created_at_asc
      - created_at_desc
      - updated_at_asc
      - updated_at_desc
      title: MemoSortOrder
    MemoTagsUpdateRequest:
      properties:
        tag_names:
          items:
            type: string
            minLength: 1
          type: array
          title: Tag Names
          examples:
          - - "\u30BF\u30B01"
            - "\u30BF\u30B02"
      type: object
      title: MemoTagsUpdateRequest
    MemoTitleUpdateRequest:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
          examples:
          - title
      type: object
      required:
      - title
      title: MemoTitleUpdateRequest
    TagCountResponse:
      properties:
        id:
          type: integer
          exclusiveMinimum: 0.0
          title: Id
          examples:
          - 1
        name:
          type: string
          minLength: 1
          title: Name
          examples:
          - Name
        used_num:
          type: integer
          exclusiveMinimum: 0.0
          title: Used Num
          examples:
          - 1
      type: object
      required:
      - id
      - name
      - used_num
      title: TagCountResponse
    TagRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: TagRead
    TagResponse:
      properties:
        id:
          type: integer
          exclusiveMinimum: 0.0
          title: Id
          examples:
          - 1
        name:
          type: string
          minLength: 1
          title: Name
          examples:
          - Name
      type: object
      required:
      - id
      - name
      title: TagResponse
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
        expired_at:
          type: string
          format: date-time
          title: Expired At
      type: object
      required:
      - access_token
      - token_type
      - expired_at
      title: Token
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
